<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Lab Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-server"></i> Home Dashboard</h1>
            </div>
            <div class="header-decoration"></div>
        </header>
        
        <main>
            <!-- All Applications in One Grid -->
            <section class="section">
                <div class="apps-grid">
                    
                    <!-- Applications -->
                    <div class="app-tile app-category" data-category="apps" onclick="openApp('https://vaultwarden.kds-dev.com')">
                        <div class="category-badge">APP</div>
                        <div class="app-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <span class="app-name">Vaultwarden</span>
                    </div>
                    
                    <div class="app-tile app-category" data-category="apps" onclick="openApp('https://immich.kds-dev.com')">
                        <div class="category-badge">APP</div>
                        <div class="app-icon">
                            <i class="fas fa-images"></i>
                        </div>
                        <span class="app-name">Immich</span>
                    </div>
                    
                    <div class="app-tile app-category" data-category="apps" onclick="openApp('https://jellyfin.kds-dev.com')">
                        <div class="category-badge">APP</div>
                        <div class="app-icon">
                            <i class="fas fa-film"></i>
                        </div>
                        <span class="app-name">Jellyfin</span>
                    </div>
                    
                    <div class="app-tile app-category" data-category="apps" onclick="openApp('https://mealie.kds-dev.com')">
                        <div class="category-badge">APP</div>
                        <div class="app-icon">
                            <i class="fas fa-utensils"></i>
                        </div>
                        <span class="app-name">Mealie</span>
                    </div>
                    
                    <div class="app-tile app-category" data-category="apps" onclick="openApp('https://filebrowser.kds-dev.com')">
                        <div class="category-badge">APP</div>
                        <div class="app-icon">
                            <i class="fas fa-folder"></i>
                        </div>
                        <span class="app-name">File Browser</span>
                    </div>

                    <!-- Infrastructure -->
                    <div class="app-tile infra-category" data-category="infra" onclick="openApp('https://adguard.kds-dev.com')">
                        <div class="category-badge">INFRA</div>
                        <div class="app-icon">
                            <i class="fas fa-shield-alt"></i>
                        </div>
                        <span class="app-name">AdGuard Home</span>
                    </div>
                    
                    <div class="app-tile infra-category" data-category="infra" onclick="openApp('https://grafana.kds-dev.com')">
                        <div class="category-badge">INFRA</div>
                        <div class="app-icon">
                            <i class="fas fa-chart-bar"></i>
                        </div>
                        <span class="app-name">Grafana</span>
                    </div>
                    
                    <div class="app-tile infra-category" data-category="infra" onclick="openApp('https://prometheus.kds-dev.com')">
                        <div class="category-badge">INFRA</div>
                        <div class="app-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <span class="app-name">Prometheus</span>
                    </div>
                    
                    <div class="app-tile infra-category" data-category="infra" onclick="openApp('http://192.168.50.1')">
                        <div class="category-badge">INFRA</div>
                        <div class="app-icon">
                            <i class="fas fa-wifi"></i>
                        </div>
                        <span class="app-name">Router</span>
                    </div>

                    <div class="app-tile infra-category" data-category="infra" onclick="openApp('http://nas.kds-dev.com')">
                        <div class="category-badge">INFRA</div>
                        <div class="app-icon">
                            <i class="fas fa-network-wired"></i>
                        </div>
                        <span class="app-name">NAS</span>
                    </div>

                    <!-- External Sites -->
                    <div class="app-tile external-category" data-category="external" onclick="openApp('https://us-east-2.signin.aws.amazon.com/')">
                        <div class="category-badge">EXTERNAL</div>
                        <div class="app-icon">
                            <i class="fab fa-aws"></i>
                        </div>
                        <span class="app-name">AWS</span>
                    </div>
                    
                    <div class="app-tile external-category" data-category="external" onclick="openApp('https://mylogin.freedommortgage.com/')">
                        <div class="category-badge">EXTERNAL</div>
                        <div class="app-icon">
                            <i class="fas fa-home"></i>
                        </div>
                        <span class="app-name">Mortgage</span>
                    </div>
                    
                    <div class="app-tile external-category" data-category="external" onclick="openApp('https://myaccount.momnt.com/login')">
                        <div class="category-badge">EXTERNAL</div>
                        <div class="app-icon">
                            <i class="fas fa-window-restore"></i>
                        </div>
                        <span class="app-name">Window Loan</span>
                    </div>
                </div>
            </section>
        </main>
        
    </div>
    
    <script>
        function openApp(url) {
            window.open(url, '_blank');
        }
    </script>
</body>
</html>

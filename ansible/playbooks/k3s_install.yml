# Phase 1 — bootstrap control plane
# serial: 1 is critical — ctrl1 completes all tasks (including verify.yml) before
# ctrl2 starts.  This guarantees:
#   - The node-token exists on ctrl1 when token.yml runs on ctrl2/ctrl3
#   - etcd quorum is not disrupted by simultaneous joins
- name: Install k3s control plane
  hosts: k3s_control
  become: true
  serial: 1
  roles:
    - k3s_control

# Phase 2 — join workers
# Workers register via the kube-vip VIP (192.168.50.110), not directly to ctrl1
- name: Install k3s workers
  hosts: k3s_workers
  become: true
  ignore_unreachable: true
  roles:
    - k3s_worker
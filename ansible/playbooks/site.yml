# site.yml — full provisioning in dependency order.
# Run against a fresh set of VMs after Terraform + cloud-init complete.
---

# ── 1. Baseline ─────────────────────────────────────────────────────────────
# Applies to every Rocky Linux VM: updates, chrony, hostname, SSH hardening,
# SELinux, and firewalld (SSH only by default).
- name: Apply rocky baseline to all VMs
  hosts: vms
  become: true
  ignore_unreachable: true
  roles:
    - rocky_baseline

# ── 2. Tailscale subnet router ───────────────────────────────────────────────
# Only ts1 — installs Tailscale, enables routing, and authenticates to the tailnet.
- name: Configure Tailscale subnet router
  hosts: tailscale
  become: true
  ignore_unreachable: true
  roles:
    - tailscale

# ── 3. k3s control plane ────────────────────────────────────────────────────
- name: Deploy k3s control plane
  hosts: k3s_control
  become: true
  ignore_unreachable: true
  roles:
    - k3s_control

# ── 4. k3s workers ──────────────────────────────────────────────────────────
- name: Deploy k3s workers
  hosts: k3s_workers
  become: true
  ignore_unreachable: true
  roles:
    - k3s_worker

# Managed by Ansible
# Determine whether an existing k3s cluster is already running on any peer
# control plane node before touching this host.
#
# This drives two critical decisions in the rest of the role:
#
#   _k3s_cluster_exists  (bool)
#     true  → at least one peer has k3s running → this node must REJOIN
#             (use --server, never --cluster-init, even if this is the init host)
#     false → no peers running → fresh bootstrap
#             (init host uses --cluster-init, others use --server after ctrl1 is up)
#
#   _k3s_token_source  (hostname)
#     The first peer that has a live k3s service.  token.yml delegates here
#     instead of always going to the init host, so rebuilding ctrl1 works.
#
# "Peer" means any control plane host that is NOT the current host being
# configured.  We check the k3s service state remotely via systemd.
---
- name: Check k3s service state on all peer control plane nodes
  ansible.builtin.systemd:
    name: k3s
  register: _peer_k3s_status
  delegate_to: "{{ item }}"
  loop: "{{ groups['k3s_control'] | difference([inventory_hostname]) }}"
  failed_when: false

- name: Set cluster-exists facts
  ansible.builtin.set_fact:
    # True if ANY peer has k3s actively running
    _k3s_cluster_exists: >-
      {{
        _peer_k3s_status.results
        | selectattr('status', 'defined')
        | selectattr('status.ActiveState', 'defined')
        | selectattr('status.ActiveState', 'equalto', 'active')
        | list | length > 0
      }}
    # First peer whose k3s service is active — used as token source
    _k3s_token_source: >-
      {{
        (_peer_k3s_status.results
        | selectattr('status', 'defined')
        | selectattr('status.ActiveState', 'defined')
        | selectattr('status.ActiveState', 'equalto', 'active')
        | first | default({})).item
        | default(k3s_init_host)
      }}

- name: Debug — cluster state detected
  ansible.builtin.debug:
    msg: >-
      cluster_exists={{ _k3s_cluster_exists }}
      token_source={{ _k3s_token_source }}

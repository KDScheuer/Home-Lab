# Managed by Ansible
# Read the cluster join token from a live peer and register it as a fact.
#
# _k3s_token_source is set by preflight.yml to the first peer that has k3s
# actively running.  This means:
#
#   Fresh bootstrap  → token_source = k3s_init_host (ctrl1, post-install)
#   Rebuilding ctrl1 → token_source = ctrl2 or ctrl3 (first live peer)
#   Rebuilding ctrl2 → token_source = ctrl1 (still the init host)
#
# serial: 1 in the playbook guarantees the token source node has completed
# its own install + verify before this runs on the next node.
---
- name: Read k3s node-token from live peer
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: _k3s_node_token_raw
  delegate_to: "{{ _k3s_token_source }}"
  become: true

- name: Set k3s_node_token fact from slurped value
  ansible.builtin.set_fact:
    k3s_node_token: "{{ _k3s_node_token_raw.content | b64decode | trim }}"

# Managed by Ansible
# Wait for this control plane node to be Ready before the play moves to the
# next host (serial: 1 in the playbook ensures ctrl2 doesn't join until ctrl1
# is healthy, and ctrl3 waits for ctrl2).
#
# Node name note: k3s registers nodes using the system FQDN (from hostnamectl),
# not the short hostname.  ansible_fqdn matches what k3s sees on Rocky 9.
---
- name: Wait for k3s API port to be reachable on this node
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 6443
    timeout: 120

- name: Show registered node names (debug)
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes --no-headers
  register: _all_nodes
  changed_when: false
  failed_when: false

- name: Debug — current node list
  ansible.builtin.debug:
    msg: "{{ _all_nodes.stdout_lines }}"

- name: Wait for this node to show Ready in the cluster
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl get node {{ ansible_fqdn }} --no-headers
  register: _node_ready_check
  until: >
    _node_ready_check.rc == 0
    and 'Ready' in _node_ready_check.stdout
    and 'NotReady' not in _node_ready_check.stdout
  retries: 30
  delay: 10
  changed_when: false

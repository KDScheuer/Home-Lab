# Managed by Ansible
# k3s control plane role — direct install, no community role dependency.
#
# Execution order matters — each task file handles one logical phase:
#   preflight.yml — probe peers to detect if cluster already exists
#   firewall.yml  — open required ports
#   kube_vip      — place DaemonSet manifest before k3s starts
#   token.yml     — slurp join token from first live peer
#                   (skipped only on the init node during a fresh bootstrap)
#   install.yml   — download + run k3s install script, enable service
#   verify.yml    — wait for this node to appear Ready
#
# The playbook (k3s_install.yml) runs this role with serial: 1 so each node
# completes all phases before the next one starts.  This is required so
# token.yml always has a live peer to read from.
---
- name: Probe peers to detect existing cluster state
  ansible.builtin.import_tasks: preflight.yml

- name: Open required firewall ports for k3s control plane
  ansible.builtin.import_tasks: firewall.yml

- name: Deploy kube-vip manifest before k3s bootstrap
  ansible.builtin.import_role:
    name: kube_vip

# Skip token.yml only when this is the init node AND no cluster exists yet
# (fresh first-node bootstrap — no peer to read from).
# All other cases — joining nodes on fresh bootstrap, or any node being
# rebuilt while peers are running — need to slurp the token from a live peer.
- name: Read cluster join token from live peer
  ansible.builtin.include_tasks: token.yml
  when: not (inventory_hostname == k3s_init_host and not _k3s_cluster_exists)

- name: Install k3s server
  ansible.builtin.import_tasks: install.yml

- name: Verify node is Ready before play continues to next host
  ansible.builtin.import_tasks: verify.yml

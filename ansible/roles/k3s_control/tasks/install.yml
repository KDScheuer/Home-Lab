# Managed by Ansible
# Install k3s in server mode using the official install script.
# Mirrors the worker role's pattern: idempotency check → download → install → enable.
#
# Init node  (first in k3s_control): --cluster-init, seeds the etcd cluster.
# Joining nodes (all others):         --server pointing at the VIP, reads token
#                                      set by token.yml before this file runs.
#
# INSTALL_K3S_EXEC is the standard way to pass server sub-command flags to the
# install script. K3S_TOKEN seeds the shared secret; INSTALL_K3S_SKIP_START is
# left unset so the service starts immediately after install.
#
# Idempotency guard: check for the k3s binary, not service state.
# Gating on ActiveState would re-run the install script if k3s is installed but
# stopped (e.g. after a reboot before enable sticks).  Binary presence means
# "already installed" regardless of whether the service is currently up.
---
- name: Check if k3s binary is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: _k3s_binary

- name: Download k3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: /tmp/k3s-install.sh
    mode: '0755'
  when: not _k3s_binary.stat.exists

# Build flag strings once so both install tasks stay readable.
- name: Build TLS-SAN and disable flag strings
  ansible.builtin.set_fact:
    _k3s_tls_san_flags: >-
      {% for san in k3s_tls_sans %}--tls-san {{ san }}{% if not loop.last %} {% endif %}{% endfor %}
    _k3s_disable_flags: >-
      {% for item in k3s_disable %}--disable {{ item }}{% if not loop.last %} {% endif %}{% endfor %}
  when: not _k3s_binary.stat.exists

# ── Init node — fresh bootstrap only ─────────────────────────────────────────
# --cluster-init is used ONLY when no peers are running (brand new cluster).
# If _k3s_cluster_exists is true, even the init host must rejoin with --server
# to avoid bootstrapping a second etcd cluster and destroying the existing one.
- name: Install k3s server — init node (cluster-init, fresh bootstrap)
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_EXEC: >-
      server
      --cluster-init
      {{ _k3s_tls_san_flags }}
      {{ _k3s_disable_flags }}
      --write-kubeconfig-mode {{ k3s_kubeconfig_mode }}
  when:
    - inventory_hostname == k3s_init_host
    - not _k3s_cluster_exists
    - not _k3s_binary.stat.exists
  changed_when: true

# ── All other cases — rejoin existing cluster ─────────────────────────────────
# Covers: ctrl2/ctrl3 on fresh bootstrap, AND any node being rebuilt while
# the rest of the cluster is still running (including ctrl1 being rebuilt).
# k3s_node_token is registered by token.yml before this file runs.
- name: Install k3s server — rejoin existing cluster
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    K3S_TOKEN: "{{ k3s_node_token }}"
    INSTALL_K3S_EXEC: >-
      server
      --server https://{{ k3s_api_vip }}:6443
      {{ _k3s_tls_san_flags }}
      {{ _k3s_disable_flags }}
      --write-kubeconfig-mode {{ k3s_kubeconfig_mode }}
  when:
    - not (inventory_hostname == k3s_init_host and not _k3s_cluster_exists)
    - not _k3s_binary.stat.exists
  changed_when: true

# ── Service state ─────────────────────────────────────────────────────────────
- name: Ensure k3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

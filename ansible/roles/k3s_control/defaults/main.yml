# Managed by Ansible
---
# Ports required by k3s control plane nodes
# https://docs.k3s.io/installation/requirements#networking
k3s_control_firewall_ports:
  - 6443/tcp    # Kubernetes API server (workers + secondary controllers join here)
  - 9345/tcp    # k3s supervisor API (secondary server nodes use this to join HA cluster)
  - 2379/tcp    # etcd client requests
  - 2380/tcp    # etcd peer communication
  - 10250/tcp   # kubelet API (metrics, exec, logs)
  - 8472/udp    # Flannel VXLAN overlay network

# ── Install ───────────────────────────────────────────────────────────────────
# Official k3s install script
k3s_install_url: "https://get.k3s.io"

# The first host in k3s_control bootstraps with --cluster-init.
# All subsequent hosts join with --server pointing at the VIP.
k3s_init_host: "{{ groups['k3s_control'] | first }}"

# ── API / TLS ─────────────────────────────────────────────────────────────────
# VIP used for --server on joining nodes and for kubeconfig.
# Defaults to kubevip_vip so it stays in sync — override here only if needed.
k3s_api_vip: "{{ kubevip_vip }}"

# Additional TLS SANs beyond the VIP (control plane node IPs).
# Override in group_vars/k3s_control.yml with your real IPs.
k3s_tls_sans:
  - "{{ k3s_api_vip }}"
  - "192.168.50.111"
  - "192.168.50.112"
  - "192.168.50.113"

# ── Cluster options ───────────────────────────────────────────────────────────
# Bundled components to disable — replaced by Helm/Flux-managed releases
k3s_disable:
  - traefik
  - servicelb

# Permissions on /etc/rancher/k3s/k3s.yaml so ansible user can run kubectl
k3s_kubeconfig_mode: "0644"

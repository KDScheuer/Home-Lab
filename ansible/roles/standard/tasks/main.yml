---
# -- Packages --
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - nfs-utils
      - chrony
    state: present

# -- Time --
- name: Set timezone
  community.general.timezone:
    name: America/Boise

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart chronyd

- name: Ensure chronyd is enabled and running
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

# -- Hostname --
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# -- Security --
- name: Ensure SELinux is enforcing
  ansible.posix.selinux:
    policy: targeted
    state: enforcing

- name: Disable root SSH access
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart sshd

# -- Users --
- name: Create users
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: present
    groups: wheel
    append: true
  loop: "{{ lab_users }}"

- name: Deploy SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ lookup('file', item.key) }}"
  loop: "{{ lab_users }}"

# -- NFS --
- name: Create NFS mount point
  ansible.builtin.file:
    path: /mnt/synology
    state: directory
    owner: "{{ lab_users[0].name }}"
    group: "{{ lab_users[0].name }}"
    mode: '0755'

- name: Mount Synology NFS share
  ansible.posix.mount:
    path: /mnt/synology
    src: "{{ nfs_server }}:{{ nfs_share }}"
    fstype: nfs
    state: mounted
    opts: defaults,_netdev

# -- Firewall --
- name: Open required firewall ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_ports }}"

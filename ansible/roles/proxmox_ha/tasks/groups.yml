# Managed by Ansible
---
# HA config is cluster-wide (/etc/pve is shared via pmxcfs).
# run_once ensures ha-manager commands execute on a single node only.
# Tasks are skipped for rules with an empty resources list.
# Resources whose VMs do not yet exist emit a warning and are skipped,
# preventing a chicken-and-egg deadlock between Terraform and Ansible.

- name: Check if VM exists in Proxmox
  ansible.builtin.command: >-
    pvesh get /cluster/resources
    --type vm
    --output-format json
  register: pve_all_vms
  changed_when: false
  run_once: true

- name: Warn and filter resources whose VMs do not exist yet
  ansible.builtin.debug:
    msg: >-
      WARNING: HA resource {{ item }} not found in Proxmox —
      skipping HA enrollment until VM is created by Terraform.
  loop: "{{ pve_ha_rules | map(attribute='resources') | flatten | unique }}"
  loop_control:
    label: "{{ item }}"
  when: >-
    (item | regex_replace('^vm:', '') | int | string)
    not in (pve_all_vms.stdout | from_json | map(attribute='vmid') | map('string') | list)
  run_once: true

- name: Build list of resources whose VMs exist
  ansible.builtin.set_fact:
    pve_ha_ready_resources: >-
      {{
        pve_ha_rules
        | map(attribute='resources') | flatten | unique
        | select('match', '^vm:')
        | map('regex_replace', '^vm:', '')
        | select('in', pve_all_vms.stdout | from_json | map(attribute='vmid') | map('string') | list)
        | map('regex_replace', '^', 'vm:')
        | list
      }}
  run_once: true

- name: Check if HA resource is already enrolled
  ansible.builtin.command: pvesh get /cluster/ha/resources/{{ item }}
  register: pve_ha_resource_check
  failed_when: false
  changed_when: false
  run_once: true
  loop: "{{ pve_ha_ready_resources }}"
  loop_control:
    label: "{{ item }}"

- name: Enroll resource in HA management
  ansible.builtin.command: ha-manager add {{ item.item }} --state started
  when: item.rc != 0
  run_once: true
  loop: "{{ pve_ha_resource_check.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check if HA node affinity rule already exists
  ansible.builtin.command: pvesh get /cluster/ha/rules/{{ item.name }}
  register: pve_ha_rule_check
  failed_when: false
  changed_when: false
  run_once: true
  loop: "{{ pve_ha_rules }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create HA node affinity rule
  ansible.builtin.command: >-
    ha-manager rules add node-affinity {{ item.item.name }}
    --nodes {{ item.item.nodes }}
    --resources {{ item.item.resources | select('in', pve_ha_ready_resources) | join(',') }}
    --strict {{ item.item.strict }}
  when:
    - item.rc != 0
    - item.item.resources | select('in', pve_ha_ready_resources) | list | length > 0
  run_once: true
  loop: "{{ pve_ha_rule_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  notify: reload pve-ha-lrm

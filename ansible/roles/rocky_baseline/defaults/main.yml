# Managed by Ansible
---
# Timezone
timezone: "America/Boise"

# NTP servers used in chrony.conf
ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
  - 3.pool.ntp.org

# Firewall — baseline only opens SSH.
# Each role is responsible for opening its own ports/services.
firewall_services:
  - ssh

firewall_ports: []

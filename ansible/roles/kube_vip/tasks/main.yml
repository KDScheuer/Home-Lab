# Managed by Ansible
---
- name: Create k3s manifests directory
  ansible.builtin.file:
    path: "{{ kubevip_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy kube-vip DaemonSet manifest
  ansible.builtin.template:
    src: kube-vip.yaml.j2
    dest: "{{ kubevip_manifest_dir }}/kube-vip.yaml"
    owner: root
    group: root
    mode: '0644'

- name: Verify kube-vip manifest is in place
  ansible.builtin.stat:
    path: "{{ kubevip_manifest_dir }}/kube-vip.yaml"
  register: kubevip_manifest
  failed_when: not kubevip_manifest.stat.exists

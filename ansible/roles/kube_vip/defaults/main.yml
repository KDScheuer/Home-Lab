# Managed by Ansible
---
# kube-vip version and image defaults
# These can be overridden in group_vars (e.g., to pin a different version per environment)
kubevip_version: "v0.8.7"
kubevip_image: "ghcr.io/kube-vip/kube-vip:{{ kubevip_version }}"

# Network defaults — typically overridden in group_vars/k3s_control.yml
kubevip_vip: "192.168.50.110"
kubevip_interface: "eth0"

# k3s places auto-deployed manifests here (picked up on k3s start)
kubevip_manifest_dir: "/var/lib/rancher/k3s/server/manifests"

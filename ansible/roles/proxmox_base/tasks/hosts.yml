---
- name: Ensure all Proxmox cluster nodes are in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ item.ip }}\\s"
    line: "{{ item.ip }}  {{ item.fqdn }}  {{ item.name }}"
    state: present
  loop: "{{ proxmox_nodes }}"
 
- name: Ensure NAS is in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^192\\.168\\.50\\.201\\s"
    line: "192.168.50.201  nas.kds-dev.com  nas"
    state: present
---
- name: Check proxmoxlib.js exists
  ansible.builtin.stat:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
  register: proxmoxlib_stat

- name: Remove subscription nag from Proxmox web UI
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "res\\.data\\.status\\.toLowerCase\\(\\) !== 'active'"
    replace: "false"
    backup: true
  when: proxmoxlib_stat.stat.exists
  notify: restart pveproxy

- name: Verify nag patch was applied
  ansible.builtin.command:
    cmd: grep -c "false" /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
  register: nag_patch_check
  changed_when: false
  failed_when: false
  when: proxmoxlib_stat.stat.exists

- name: Warn if nag patch was not applied
  ansible.builtin.debug:
    msg: "WARNING: subscription nag patch did not apply on {{ inventory_hostname }} - regexp may not match this PVE version"
  when: proxmoxlib_stat.stat.exists and nag_patch_check.stdout | int == 0
---
# PVE 9 uses deb822 .sources format, not the legacy single-line .list format
# Debian 13 Trixie's apt will warn about .list files - use .sources throughout

- name: Disable PVE enterprise repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-enterprise.sources
    content: |
      # Disabled by Ansible - no subscription key
      # Types: deb
      # URIs: https://enterprise.proxmox.com/debian/pve
      # Suites: {{ proxmox_debian_release }}
      # Components: pve-enterprise
      # Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    owner: root
    group: root
    mode: '0644'

- name: Remove legacy pve-enterprise.list if present
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    state: absent

- name: Disable Ceph enterprise repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ceph.sources
    content: |
      # Disabled by Ansible - no subscription key
      # Types: deb
      # URIs: https://enterprise.proxmox.com/debian/ceph-squid
      # Suites: {{ proxmox_debian_release }}
      # Components: enterprise
      # Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    owner: root
    group: root
    mode: '0644'

- name: Configure PVE no-subscription repository (deb822 format)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ proxmox_debian_release }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    owner: root
    group: root
    mode: '0644'
  notify: apt update cache

- name: Configure Ceph no-subscription repository (deb822 format)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ceph-no-subscription.sources
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/ceph-squid
      Suites: {{ proxmox_debian_release }}
      Components: no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    owner: root
    group: root
    mode: '0644'
  notify: apt update cache

- name: Remove legacy pve-no-subscription.list if present (avoid duplicates)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-no-subscription.list
    state: absent
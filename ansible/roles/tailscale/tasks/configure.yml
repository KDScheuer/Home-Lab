# Managed by Ansible
# Ansible configures the system prerequisites for Tailscale (IP forwarding).
# Joining the tailnet is done manually — see RUNBOOK-tailscale-join.md.
---
- name: Enable IPv4 forwarding for subnet routing
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true

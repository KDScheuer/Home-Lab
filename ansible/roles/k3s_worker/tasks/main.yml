# Managed by Ansible
# k3s worker role — direct install, not using xanmanning.k3s.
#
# xanmanning.k3s defaults to server mode and its idempotency guard prevents
# the service file from being regenerated when k3s is already present — making
# it unreliable for agent installs. This role uses the official k3s install
# script directly, which correctly installs agent mode when K3S_URL is set.
---
- name: Open required firewall ports for k3s worker
  ansible.builtin.import_tasks: firewall.yml

- name: Check current k3s service mode
  ansible.builtin.command: grep -c "k3s server" /etc/systemd/system/k3s.service
  register: k3s_server_mode_check
  changed_when: false
  failed_when: false

- name: Uninstall k3s server mode if present on a worker node
  ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
  when: k3s_server_mode_check.rc == 0 and k3s_server_mode_check.stdout | int > 0
  changed_when: true

- name: Check if k3s agent is already installed and running
  ansible.builtin.systemd:
    name: k3s-agent
  register: k3s_agent_status
  failed_when: false

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  when: k3s_agent_status.status is not defined or k3s_agent_status.status.ActiveState | default('') != 'active'

- name: Install k3s agent
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    K3S_URL: "https://{{ k3s_registration_address }}:6443"
    K3S_TOKEN: "{{ k3s_token }}"
    K3S_NODE_NAME: "{{ ansible_hostname }}"
    INSTALL_K3S_SKIP_START: "false"
  when: k3s_agent_status.status is not defined or k3s_agent_status.status.ActiveState | default('') != 'active'
  changed_when: true

- name: Ensure k3s-agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true

- name: Wait for worker node to register with the cluster
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl get node {{ ansible_hostname }}
  delegate_to: "{{ groups['k3s_control'][0] }}"
  become: true
  register: node_ready
  until: node_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Label worker nodes with role=worker
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl label node {{ ansible_hostname }}
    kubernetes.io/role=worker
    --overwrite
  delegate_to: "{{ groups['k3s_control'][0] }}"
  become: true
  register: kubectl_label_result
  changed_when: "'not labeled' not in kubectl_label_result.stdout"

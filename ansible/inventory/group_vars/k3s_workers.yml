# Managed by Ansible
# Variables for k3s worker nodes (work1, work2, work3)
---

# --- xanmanning.k3s role configuration ---
# The role uses k3s_control_node (not k3s_role) to decide server vs agent mode.
# Explicitly set false here to prevent any ambiguity.
k3s_control_node: false

# Workers connect to the cluster via the kube-vip VIP, not directly to ctrl1.
# This ensures HA from day one — no single point of failure at the API endpoint.
k3s_registration_address: "192.168.50.110"

# Required when running as a non-root user — tells the role's own tasks to
# use privilege escalation (play-level become does not propagate into the role).
k3s_become: true

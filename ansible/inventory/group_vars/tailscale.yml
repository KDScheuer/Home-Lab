# Managed by Ansible
---
# Tailscale advertises this subnet to the tailnet so remote devices
# can reach all LAN hosts without installing Tailscale on each one.
tailscale_advertise_routes: "192.168.50.0/24"

# Accept routes advertised by other tailnet nodes (optional but recommended).
tailscale_accept_routes: true

# Tailscale auth key — generate a reusable/ephemeral key at:
# https://login.tailscale.com/admin/settings/keys
# Store in ansible-vault or pass via --extra-vars at runtime.
tailscale_authkey: ""

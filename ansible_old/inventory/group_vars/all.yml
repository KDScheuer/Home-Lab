# Variables applied to every host in inventory
ansible_become: true
ansible_become_method: sudo
ansible_python_interpreter: /usr/bin/python3

# -- Time --
timezone: America/Boise
ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org

# -- NFS --
nfs_server: 192.168.50.201
nfs_share: /volume1/networkShare
nfs_mount_point: /mnt/synology
nfs_mount_opts: defaults,_netdev

# -- Users --
lab_users:
  - name: home-user
    key: ~/.ssh/home-user.pub

# -- Firewall --
firewall_ports:
  - 22/tcp
  - 9100/tcp  # Prometheus node exporter


---
# Apply baseline configuration to every node
- name: Standard configuration
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for node to finish rebooting
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Apply standard role
      ansible.builtin.include_role:
        name: standard

# Apply k3s configuration to k3s cluster nodes
- name: k3s configuration
  hosts: k3s_nodes
  become: true
  roles:
    - k3s

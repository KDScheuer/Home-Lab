---
# Fallback defaults — site-specific values are defined in inventory/group_vars/all.yml
# and take precedence over these. These exist so the role has valid values
# if run against an inventory that does not define them.

timezone: UTC

ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org

# lab_users: empty list by default — loops are skipped if not overridden in inventory
lab_users: []

# nfs_server and nfs_share have no sensible defaults and MUST be defined in inventory.
# Intentionally omitted here so Ansible raises an explicit undefined variable error
# if they are missing, rather than silently applying a wrong value.

nfs_mount_point: /mnt/nfs
nfs_mount_opts: defaults,_netdev

firewall_ports:
  - 22/tcp

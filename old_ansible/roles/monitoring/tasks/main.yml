---
# Role: monitoring
# Deploys the homelab_exporter Python service as a systemd unit.
# Exposes container status metrics to Prometheus on port 9090.

- name: Create homelab_exporter system user
  ansible.builtin.user:
    name: "{{ homelab_exporter_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    groups: docker
    append: true

- name: Create exporter working directory
  ansible.builtin.file:
    path: /opt/homelab_exporter
    state: directory
    owner: "{{ homelab_exporter_user }}"
    group: "{{ homelab_exporter_user }}"
    mode: '0755'

- name: Deploy homelab_exporter Python script
  ansible.builtin.copy:
    src: homelab_exporter.py
    dest: /opt/homelab_exporter/homelab_exporter.py
    owner: "{{ homelab_exporter_user }}"
    group: "{{ homelab_exporter_user }}"
    mode: '0755'
  notify: Restart homelab-exporter

- name: Deploy homelab_exporter systemd service unit
  ansible.builtin.copy:
    src: homelab_exporter.service
    dest: /etc/systemd/system/homelab_exporter.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart homelab-exporter

- name: Enable and start homelab_exporter
  ansible.builtin.systemd:
    name: homelab_exporter
    enabled: true
    state: started
    daemon_reload: true

---
# Role: tls
# Covers: install certbot + dns-route53 plugin, deploy AWS credentials,
#         issue wildcard cert for all subdomains, copy certs to /srv/certs

- name: Install certbot and Route53 DNS plugin
  ansible.builtin.dnf:
    name:
      - certbot
      - python3-certbot-dns-route53
    state: present

- name: Create root AWS credentials directory
  ansible.builtin.file:
    path: /root/.aws
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy AWS credentials for Route53 DNS challenge
  ansible.builtin.template:
    src: aws_credentials.j2
    dest: /root/.aws/credentials
    owner: root
    group: root
    mode: '0600'
  # aws_access_key_id and aws_secret_access_key must be set in env/<host>.env
  # or passed via extra-vars: -e @secrets.yml

- name: Issue TLS certificate via Route53 DNS-01 challenge
  ansible.builtin.command: >
    certbot certonly
    --dns-route53
    -d home.{{ homelab_domain }}
    -d mealie.{{ homelab_domain }}
    -d adguard.{{ homelab_domain }}
    -d immich.{{ homelab_domain }}
    -d prometheus.{{ homelab_domain }}
    -d grafana.{{ homelab_domain }}
    -d jellyfin.{{ homelab_domain }}
    -d caddy.{{ homelab_domain }}
    -d vaultwarden.{{ homelab_domain }}
    -d filebrowser.{{ homelab_domain }}
    --agree-tos
    --email {{ homelab_email }}
    --non-interactive
  args:
    creates: /etc/letsencrypt/live/home.{{ homelab_domain }}/fullchain.pem
  # creates: makes this idempotent - skips if cert already exists

- name: Create /srv/certs directory for container access
  ansible.builtin.file:
    path: "{{ homelab_cert_dir }}"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: '0755'

- name: Copy live certificates to /srv/certs (dereference symlinks)
  ansible.builtin.shell: >
    cp -L {{ homelab_letsencrypt_live }}/* {{ homelab_cert_dir }}/
  changed_when: true
  # Note: Run with --tags tls after renewal to refresh the copies.
  # For automatic renewal, add a post-hook to certbot's renewal config:
  # /etc/letsencrypt/renewal-hooks/post/copy-certs.sh

- name: Set cert file ownership to homelab user
  ansible.builtin.file:
    path: "{{ homelab_cert_dir }}"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    recurse: true

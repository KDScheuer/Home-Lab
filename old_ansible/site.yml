---
# Home Lab - Full Server Provisioning Playbook
#
# Usage:
#   ansible-playbook -i inventory.yml site.yml
#
# Run a single role with tags:
#   ansible-playbook -i inventory.yml site.yml --tags services
#   ansible-playbook -i inventory.yml site.yml --tags backup
#
# First-time setup: run roles in order (all are idempotent after initial run)

- name: Provision home lab server
  hosts: homelab
  become: true

  roles:
    - role: base       # OS: network, NTP, packages, SSH hardening
      tags: [base]

    - role: storage    # Disk: partition, XFS, fstab, /srv directories
      tags: [storage]

    - role: docker     # Docker CE, daemon, proxy network, compose directories
      tags: [docker]

    - role: tls        # certbot + Route53, copy certs to /srv/certs
      tags: [tls]

    - role: services   # Deploy all docker-compose stacks and configs
      tags: [services]

    - role: backup     # Backup script + cron jobs
      tags: [backup]

    - role: monitoring # homelab_exporter systemd service
      tags: [monitoring]

apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-postgres
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.50.201
    path: /volume1/networkShare/srv/immich/postgres
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-photos
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.50.201
    path: /volume1/networkShare/srv/immich/photos
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-model-cache
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.50.201
    path: /volume1/networkShare/srv/immich/model-cache
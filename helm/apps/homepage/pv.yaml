apiVersion: v1
kind: PersistentVolume
metadata:
  name: homepage-config
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.0.201
    path: /volume1/networkShare/srv/homepage/config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homepage-config
  namespace: homepage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: homepage-config
  resources:
    requests:
      storage: 1Gi
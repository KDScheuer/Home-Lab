apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.50.201
    path: /volume1/networkShare/srv/mealie/data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-postgres
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.50.201
    path: /volume1/networkShare/srv/mealie/postgres
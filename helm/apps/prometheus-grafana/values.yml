# kube-prometheus-stack values
# Deploy with:
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace -f values.yml

# ── Grafana ─────────────────────────────────────────────────────────────────
grafana:
  adminPassword: "1qaz2wsx!QAZ@WSX"

  ingress:
    enabled: false  # using Traefik IngressRoute instead

  persistence:
    enabled: true
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    volumeName: grafana-data

  # default dashboards
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: "America/Boise"

  grafana.ini:
    server:
      root_url: https://grafana.kds-dev.com
    security:
      allow_embedding: true

# ── Prometheus ───────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: "20GB"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ""
          volumeName: prometheus-data
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    # scrape AdGuard metrics directly - no exporter needed
    # scrape blackbox and snmp via additional configs below
    additionalScrapeConfigs:
      - job_name: "adguard"
        static_configs:
          - targets: ["adguard-dns.adguard.svc.cluster.local:3000"]
        metrics_path: '/metrics'
        scrape_interval: 30s

      - job_name: "blackbox-icmp"
        metrics_path: /probe
        params:
          module: [icmp]
        static_configs:
          - targets:
              - 8.8.8.8
              - 1.1.1.1
              - 192.168.0.1
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

      - job_name: "blackbox-http"
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - https://vaultwarden.kds-dev.com
              - https://immich.kds-dev.com
              - https://jellyfin.kds-dev.com
              - https://adguard.kds-dev.com
              - https://mealie.kds-dev.com
              - https://home.kds-dev.com
              - https://grafana.kds-dev.com
              - https://nas.kds-dev.com
              - https://proxmox.kds-dev.com
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

      - job_name: "synology-snmp"
        metrics_path: /snmp
        params:
          module: [synology]
          target: ["192.168.0.201"]
        static_configs:
          - targets:
              - snmp-exporter-prometheus-snmp-exporter.monitoring.svc.cluster.local:9116
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: snmp-exporter-prometheus-snmp-exporter.monitoring.svc.cluster.local:9116

# ── Node Exporter ─────────────────────────────────────────────────────────────
nodeExporter:
  enabled: true

# ── Kube State Metrics ────────────────────────────────────────────────────────
kubeStateMetrics:
  enabled: true

# ── Alertmanager ─────────────────────────────────────────────────────────────
alertmanager:
  enabled: false  # disable for now, enable later if needed
deployment:
  replicas: 3

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/address-pool: homelab-pool

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true

ports:
  web:
    port: 80
    expose:
      default: true
  websecure:
    port: 443
    expose:
      default: true

logs:
  general:
    level: INFO